    <script>
      // Auto-recuperação: se o HTML em cache apontar para assets antigos (404),
      // limpamos service worker + caches e recarregamos uma única vez.
      (function () {
        var KEY = 'asset-recovery-ts';
        function recover(reason) {
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - last < 30000) return; // evita loop
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          console.warn('Recarregando após falha de asset:', reason);
          var done = function () {
            location.replace(location.pathname + location.search + (location.search ? '&' : '?') + 'v=' + Date.now() + location.hash);
          };
          var tasks = [];
          if (window.caches) tasks.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          }
          Promise.all(tasks).catch(function () {}).then(done);
          setTimeout(done, 2000);
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || !t.tagName) return;
            var tag = t.tagName.toLowerCase();
            if (tag === 'script' || (tag === 'link' && t.rel === 'stylesheet')) {
              var src = t.src || t.href || '';
              if (src.indexOf('/assets/') !== -1 || src.indexOf('/src/') !== -1) recover(src);
            }
          },
          true
        );
        window.addEventListener('vite:preloadError', function (e) { recover('preloadError'); });
      })();
    </script>
